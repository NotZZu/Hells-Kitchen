name: Generate tests (LLM)

# 요구사항별 시험 코드 생성. 수동 실행 전용.
# 시크릿: ANTHROPIC_API_KEY, GEMINI_API_KEY, DEEPSEEK_API_KEY, SHARED_REPO_TOKEN
# 로컬 모델은 runner에 self-hosted 라벨을 지정. 주소와 모델 이름은 Tools/generator/models.json의 local 항목.

run-name: >-
  생성 ${{ inputs.provider == 'anthropic' && inputs.anthropic_model || inputs.provider == 'google' && inputs.google_model || inputs.provider == 'deepseek' && inputs.deepseek_model || 'local' }}

on:
  workflow_dispatch:
    inputs:
      provider:
        description: '회사 선택'
        type: choice
        required: true
        default: anthropic
        options:
          - anthropic
          - google
          - deepseek
          - local
      anthropic_model:
        description: 'Anthropic 모델'
        type: choice
        default: claude-haiku-5-5
        options:
          - claude-fable-5-1
          - claude-mythos-5-1
          - claude-fable-5
          - claude-mythos-5
          - claude-opus-5-5
          - claude-opus-5
          - claude-opus-4-8
          - claude-opus-4-7
          - claude-opus-4-6
          - claude-opus-4-5-20251101
          - claude-sonnet-5-5
          - claude-sonnet-5
          - claude-sonnet-4-6
          - claude-haiku-5-5
          - claude-haiku-4-5-20251001
      google_model:
        description: 'Google 모델'
        type: choice
        default: gemini-3.1-flash-lite
        options:
          - gemini-4-argon
          - gemini-3.8-flash
          - gemini-3.6-flash
          - gemini-3.5-flash
          - gemini-3.5-flash-lite
          - gemini-3.1-flash-lite
          - gemini-3.1-pro-preview
          - gemini-3-flash-preview
          - gemini-2.5-pro
          - gemini-2.5-flash
          - gemini-2.5-flash-lite
      deepseek_model:
        description: 'DeepSeek 모델'
        type: choice
        default: deepseek-flash
        options:
          - deepseek-flash
          - deepseek-v4-pro
      reqs:
        description: '요구사항 ID  FR-FRESH-001,FR-DROP-017'
        required: true
      granularity:
        description: '호출 단위'
        type: choice
        options:
          - 요구사항별
          - 모듈별
          - 전체 한 번에
        default: 요구사항별
      budget_krw:
        description: '예산 상한 ₩'
        required: true
        default: '500'
      allow_unpriced:
        description: '단가 없는 모델 허용'
        type: boolean
        default: false
      open_pr:
        description: 'PR 생성'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  generate:
    name: 생성 ${{ inputs.provider == 'anthropic' && inputs.anthropic_model || inputs.provider == 'google' && inputs.google_model || inputs.provider == 'deepseek' && inputs.deepseek_model || 'local' }}
    runs-on: ${{ inputs.provider == 'local' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      # 입력값은 환경 변수로만 사용
      PROVIDER: ${{ inputs.provider }}
      ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
      GOOGLE_MODEL: ${{ inputs.google_model }}
      DEEPSEEK_MODEL: ${{ inputs.deepseek_model }}
      ALLOW_UNPRICED: ${{ inputs.allow_unpriced }}
      REQS: ${{ inputs.reqs }}
      GRANULARITY: ${{ inputs.granularity }}
      BUDGET_KRW: ${{ inputs.budget_krw }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: 입력 확인
        run: |
          case "$PROVIDER" in
            anthropic) PROFILE="$ANTHROPIC_MODEL" ;;
            google)    PROFILE="$GOOGLE_MODEL" ;;
            deepseek)  PROFILE="$DEEPSEEK_MODEL" ;;
            local)     PROFILE="local" ;;
            *) echo "::error::알 수 없는 회사: $PROVIDER"; exit 1 ;;
          esac
          [[ "$PROFILE" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::모델 이름 형식 오류"; exit 1; }
          [[ "$BUDGET_KRW" =~ ^[0-9]+$ ]] || { echo "::error::예산은 숫자만 가능"; exit 1; }
          [[ "$REQS" =~ ^[A-Z0-9,-]+$ ]] || { echo "::error::요구사항 ID 형식 오류"; exit 1; }
          jq -e --arg p "$PROFILE" '.profiles[$p]' Tools/generator/models.json > /dev/null \
            || { echo "::error::models.json에 없는 모델: $PROFILE"; exit 1; }
          case "$GRANULARITY" in
            "요구사항별")   GRAN=requirement ;;
            "모듈별")       GRAN=module ;;
            "전체 한 번에") GRAN=all ;;
            *) echo "::error::호출 단위 오류: $GRANULARITY"; exit 1 ;;
          esac
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "GRAN=$GRAN" >> "$GITHUB_ENV"
          echo "선택: 회사 $PROVIDER, 모델 $PROFILE"

      - name: Testing.Shared 받기
        uses: actions/checkout@v4
        with:
          repository: NotZZu/Testing.Shared
          ref: main
          token: ${{ secrets.SHARED_REPO_TOKEN }}
          path: _shared
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 생성기 빌드
        run: dotnet build "_shared/Tools~/GeneratorCli" -c Release -o _cli

      - name: 연결 확인
        run: dotnet _cli/Testing.Shared.Generator.Cli.dll doctor --models Tools/generator/models.json --profile "$PROFILE"

      - name: 예상 비용
        run: |
          args=(estimate --models Tools/generator/models.json --data Tools/generator --profile "$PROFILE" --reqs "$REQS")
          dotnet _cli/Testing.Shared.Generator.Cli.dll "${args[@]}"

      - name: 시험 코드 생성
        run: |
          args=(generate --models Tools/generator/models.json --data Tools/generator --profile "$PROFILE"
                --granularity "$GRAN" --budget-krw "$BUDGET_KRW" --out gen_out)
          [ "$ALLOW_UNPRICED" = "true" ] && args+=(--allow-unpriced true)
          args+=(--reqs "$REQS")
          dotnet _cli/Testing.Shared.Generator.Cli.dll "${args[@]}"

      - name: 요약 표시
        if: always()
        run: |
          f="gen_out/$PROFILE/summary.md"
          [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" || echo "요약 파일 없음. 생성 전에 실패." >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen-${{ env.PROFILE }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: gen_out
          if-no-files-found: warn

      # GITHUB_TOKEN으로 올린 브랜치는 CI가 자동 시작되지 않아 ci.yml을 직접 실행
      - name: 브랜치와 PR 생성
        if: ${{ inputs.open_pr }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cs=$(ls "gen_out/$PROFILE"/GeneratedTests_*.cs 2>/dev/null | head -n 1)
          if [ -z "$cs" ]; then echo "생성된 시험 코드 없음. PR 생략."; exit 0; fi

          # Re-run은 실행 번호가 같아서 시도 번호를 함께 붙임
          branch="gen/${PROFILE}-${{ github.run_number }}-${{ github.run_attempt }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          mkdir -p Assets/_Project/Tests/Generated
          cp "$cs" Assets/_Project/Tests/Generated/
          git add Assets/_Project/Tests/Generated
          git commit -m "test(generated): $PROFILE 생성 시험 ${{ github.run_number }}회차"
          git push origin "$branch"

          # PR 생성 권한이 꺼져 있어도 브랜치는 올라가 있으므로 경고만 남기고 계속
          if ! gh pr create --base main --head "$branch" \
                --title "$PROFILE 생성 시험 비교 ${{ github.run_number }}회차" \
                --body-file "gen_out/$PROFILE/summary.md"; then
            echo "::warning::PR 생성 실패. 브랜치 $branch는 올라가 있음. 저장소 설정에서 Actions의 PR 생성 허용 필요."
            echo "PR 생성 실패. 브랜치 \`$branch\`는 올라가 있음. 저장소 설정에서 Actions의 PR 생성을 허용하면 자동 생성됨." >> "$GITHUB_STEP_SUMMARY"
          fi
          gh workflow run ci.yml --ref "$branch"
